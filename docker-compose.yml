services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: managedocuments
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - appnet

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_spring
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/managedocuments?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: "root"
      DB_PASSWORD: "rootpass"
      JWT_SIGNER_KEY: "2b7e151628aed2a6abf7158809cf4f3c2b7e151628aed2a6abf7158809cf4f3c"
      FILE_UPLOAD_DIR: "/app/uploads"
    volumes:
      - backend_uploads:/app/uploads
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - appnet

  inspector:
    build:
      context: ./http_inspector
      dockerfile: Dockerfile
    container_name: http_inspector
    environment:
      UPSTREAM_HOST: "backend"
      UPSTREAM_PORT: "8080"
      LISTEN_PORT: "8090"
      LOG_FILE: "/logs/inspector.log"
    volumes:
      - ./logs/inspector:/logs
    expose:
      - "8090"
    depends_on:
      - backend
    networks:
      - appnet

  apache:
    image: "httpd:${APACHE_VERSION:-2.4.55}"
    container_name: apache_proxy
    volumes:
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    ports:
      - "8000:80"
    depends_on:
      - inspector
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  mysql_data:
  backend_uploads: