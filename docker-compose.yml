# Toàn bộ hệ thống: Apache (reverse proxy) + Backend Spring Boot + MySQL
# Tất cả chạy trong 1 docker-compose, dùng trực tiếp các thư mục backend/ và apache/ ở gốc project.
#
# Chạy:   docker compose up --build
# Truy cập hệ thống qua: http://localhost:8080 (Apache là cửa duy nhất vào hệ thống)
# Backend KHÔNG expose cổng ra host -> chỉ gọi được qua Apache (mạng nội bộ labnet).
#
# Đổi phiên bản Apache để làm thí nghiệm CVE-2023-25690 (xem lab-cve-2023-25690/README.md):
#   APACHE_VERSION=2.4.55 docker compose up   -> DÍNH lỗi (request smuggling)
#   APACHE_VERSION=2.4.58 docker compose up    -> ĐÃ VÁ

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: managedocuments
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [appnet]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_spring
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/managedocuments?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USERNAME: "root"
      DB_PASSWORD: "rootpass"
      JWT_SIGNER_KEY: "2b7e151628aed2a6abf7158809cf4f3c2b7e151628aed2a6abf7158809cf4f3c"
      FILE_UPLOAD_DIR: "uploads"
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "8080:8080"                  # Expose backend trực tiếp (để test + demo)
    depends_on:
      mysql:
        condition: service_healthy
    networks: [appnet]

  inspector:
    build:
      context: ./http_inspector
      dockerfile: Dockerfile
    container_name: http_inspector
    environment:
      UPSTREAM_HOST: "backend"
      UPSTREAM_PORT: "8080"
      LISTEN_PORT: "8090"
      LOG_FILE: "/logs/inspector.log"
    volumes:
      - ./logs/inspector:/logs
    depends_on:
      - backend
    # KHÔNG expose port 8090 ra host -> chỉ Apache gọi qua network nội bộ
    networks: [appnet]

  apache:
    image: "httpd:${APACHE_VERSION:-2.4.55}"
    container_name: apache_proxy
    volumes:
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    ports:
      - "8000:80"                      # host:8000 -> Apache:80 (reverse proxy, có chặn Swagger)
    depends_on:
      - inspector
    networks: [appnet]

networks:
  appnet:
    driver: bridge

volumes:
  mysql_data:
  backend_uploads:
