ServerRoot "/usr/local/apache2"
ServerName localhost
Listen 80

# Logging
LogFormat "%{%Y-%m-%dT%H:%M:%S}t.%{msec_frac}t%{%z}t remote=%a:%{remote}p conn_status=%X rid=%L \"%r\" status=%>s bytes=%b host=\"%{Host}i\" connection=\"%{Connection}i\"" lab_fmt
ErrorLogFormat "[%{cu}t] [%-m:%l] [pid %P:tid %T] [rid %L] [client %a] %M"

ErrorLog /proc/self/fd/2
LogLevel warn

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authn_core_module modules/mod_authn_core.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule headers_module modules/mod_headers.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule filter_module modules/mod_filter.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule rewrite_module modules/mod_rewrite.so

User daemon
Group daemon

TypesConfig conf/mime.types

<Directory />
    AllowOverride none
    Require all denied
</Directory>

<Directory "/usr/local/apache2/htdocs">
    AllowOverride none
    Require all granted
</Directory>

ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    ServerName localhost
    DocumentRoot "/usr/local/apache2/htdocs"

    AllowEncodedSlashes On

    ProxyRequests Off
    ProxyPreserveHost On

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 lab_fmt
    LogLevel warn rewrite:trace5 proxy:trace5

    # Chặn OpenAPI và Swagger tại Apache
    <Location "/v3/api-docs">
        Require all denied
    </Location>

    <Location "/swagger-ui">
        Require all denied
    </Location>

    <Location "/swagger-ui.html">
        Require all denied
    </Location>

    # API đi qua HTTP Inspector
    # Đặt trước rule proxy "/" để không bỏ qua Inspector
    ProxyPass        "/api/" "http://inspector:8090/api/" enablereuse=on
    ProxyPassReverse "/api/" "http://inspector:8090/api/"

    # Frontend và static resources được Spring Boot phục vụ
    # Bao gồm /, /index.html, /css/, /js/, /assets/...
    ProxyPass        "/" "http://backend:8080/"
    ProxyPassReverse "/" "http://backend:8080/"

    # Route lab: request bình thường đi tới inspector với path thật
    RewriteEngine On
    RewriteCond %{THE_REQUEST} !%0d%0a [NC]
    RewriteRule "^/categories/(\d+)$" "http://inspector:8090/api/categories/$1" [P,L]

    # Route lab: request có %0d%0a trong request line, đưa vào worker /api/ có keepalive
    RewriteRule "^/categories/(.*)" "http://inspector:8090/api/categories?$1" [P,L]
</VirtualHost>