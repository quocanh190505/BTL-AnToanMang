### httpd.conf — Apache 2.4.55 (bản DÍNH CVE-2023-25690) cho lab demo
### Vai trò: reverse proxy đứng trước backend Spring Boot, chặn Swagger ở biên.

ServerRoot "/usr/local/apache2"
ServerName localhost

LogFormat "%{%Y-%m-%dT%H:%M:%S}t.%{msec_frac}t%{%z}t remote=%a:%{remote}p conn_status=%X rid=%L \"%r\" status=%>s bytes=%b host=\"%{Host}i\" connection=\"%{Connection}i\"" lab_fmt
ErrorLogFormat "[%{cu}t] [%-m:%l] [pid %P:tid %T] [rid %L] [client %a] %M"

Listen 80
Listen 8080
Listen 8081

# --- Nạp các module cần thiết ---
LoadModule mpm_event_module      modules/mod_mpm_event.so
LoadModule authn_core_module     modules/mod_authn_core.so
LoadModule authz_core_module     modules/mod_authz_core.so
LoadModule headers_module        modules/mod_headers.so
LoadModule unixd_module          modules/mod_unixd.so
LoadModule log_config_module     modules/mod_log_config.so
LoadModule mime_module           modules/mod_mime.so
LoadModule mime_magic_module     modules/mod_mime_magic.so
LoadModule dir_module            modules/mod_dir.so
LoadModule env_module            modules/mod_env.so
LoadModule filter_module         modules/mod_filter.so
# --- Bộ ba tạo điều kiện cho lỗ hổng ---
LoadModule proxy_module          modules/mod_proxy.so
LoadModule proxy_http_module     modules/mod_proxy_http.so
LoadModule rewrite_module        modules/mod_rewrite.so

User daemon
Group daemon

ErrorLog /proc/self/fd/2
LogLevel warn rewrite:trace3 proxy:trace5

<IfModule log_config_module>
    LogFormat "%h %l %u %t \"%r\" %>s %b" common
    CustomLog /proc/self/fd/1 lab_fmt
</IfModule>

<IfModule mime_module>
    TypesConfig conf/mime.types
</IfModule>

<Directory />
    AllowOverride none
    Require all denied
</Directory>

<Directory /usr/local/apache2/htdocs>
    AllowOverride none
    Require all granted
</Directory>

ServerTokens Full
ServerSignature On

# ============================================================
# PORT 80 - PROTECTED / NORMAL
# Host: localhost:8000 (docker)
# ============================================================
<VirtualHost *:80>

    ServerName localhost
    DocumentRoot "/usr/local/apache2/htdocs"

    AllowEncodedSlashes On

    LogLevel warn rewrite:trace3 proxy:trace5

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 lab_fmt

    <Directory "/usr/local/apache2/htdocs">
        Require all granted
    </Directory>

    # Chặn path nội bộ ở protected path
    <Location "/v3/api-docs">
        Require all denied
    </Location>
    <Location "/swagger-ui">
        Require all denied
    </Location>
    <Location "/swagger-ui.html">
        Require all denied
    </Location>

    ProxyRequests Off
    ProxyPreserveHost On

    # NORMAL / SAFE proxy - chỉ proxy /api/ paths
    ProxyPass        "/api/" "http://inspector:8090/api/"
    ProxyPassReverse "/api/" "http://inspector:8090/api/"

</VirtualHost>


# ============================================================
# PORT 8080 - CVE-2023-25690 LAB (RewriteRule)
# Host: localhost:8080 (docker)
#
# Đây là đường vulnerable - proxy ALL paths
# ============================================================
<VirtualHost *:8080>

    ServerName localhost

    AllowEncodedSlashes On

    ProxyRequests Off
    ProxyPreserveHost On

    RewriteEngine On

    LogLevel warn rewrite:trace8 proxy:trace8

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 lab_fmt

    RewriteRule "^/(.*)" \
        "http://inspector:8090/$1" [P,L,NE]

</VirtualHost>


# ============================================================
# PORT 8081 - CVE-2023-25690 ALTERNATIVE LAB (ProxyPassMatch)
# Host: localhost:8081 (docker)
# ============================================================
<VirtualHost *:8081>

    ServerName localhost

    AllowEncodedSlashes On

    ProxyRequests Off
    ProxyPreserveHost On

    LogLevel warn proxy:trace8

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 lab_fmt

    ProxyPassMatch "^/(.*)" \
        "http://inspector:8090/$1" nocanon

    ProxyPassReverse "/" \
        "http://inspector:8090/"

</VirtualHost>
