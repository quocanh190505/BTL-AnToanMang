; Cấu hình stunnel: nhận HTTPS ở cổng 8443, giải mã TLS rồi chuyển tiếp
; thành HTTP thường vào backend thật (service "backend" trong docker-compose).
; stunnel ở đây được build với OpenSSL do ARG OPENSSL_VERSION chỉ định
; (xem proxy/Dockerfile) -> đây là nơi lỗi Heartbleed thực sự xảy ra.

pid = /lab/stunnel.pid
foreground = yes
output = /dev/stdout
debug = 5

; QUAN TRỌNG: ./configure của stunnel tự dò thấy OpenSSL build thủ công
; ở đây "có khả năng FIPS" và cố gọi FIPS_mode_set() lúc khởi động —
; nhưng bản OpenSSL build ở proxy/Dockerfile không có đầy đủ "FIPS
; canister" nên gọi hàm này lỗi ("fips mode not supported"), khiến
; stunnel không khởi tạo được SSL và thoát ngay. Tắt hẳn kiểm tra FIPS.
fips = no

[managedocuments]
accept = 8443
connect = backend:8080
cert = /lab/stunnel.pem
